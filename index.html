<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2b1d3a" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Anonyms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <main id="login-screen" class="screen login">
    <div class="login-card">

      <form id="login-form" autocomplete="on" novalidate onsubmit="return false">
        <label class="field">
          <span>Username</span>
          <input id="username" type="text" placeholder="Enter username"
                 autocomplete="username" autocapitalize="words" autocorrect="off" spellcheck="false" required />
        </label>

        <label class="field">
          <span>Password</span>
          <input id="password" type="password" placeholder="Enter password"
                 autocomplete="current-password" required />
        </label>

        <p id="login-error" class="login-error" role="alert" hidden></p>

        <button id="login-btn" type="submit" class="btn-primary">GO AHEAD</button>
        <p class="ver">v4</p>
      
      </form>
    </div>
  </main>

  <!-- ============ CHAT ============ -->
  <div id="chat-screen" class="screen chat" hidden>
    <header class="chat-header">
      <div class="header-title">
        <h2>Private Chat</h2>
        <p id="conn-status" class="conn-status" data-state="connecting">Connecting…</p>
      </div>
      <button id="logout-btn" class="btn-ghost" type="button">Leave</button>
    </header>

    <div id="banner" class="banner" hidden></div>

    <section id="messages" class="messages" aria-live="polite" aria-label="Conversation">
      <button id="load-earlier" class="load-earlier" type="button" hidden>Load earlier messages</button>
      <div id="message-list"></div>
      <p id="empty-state" class="empty-state" hidden>No messages yet. Say hi 😊</p>
    </section>

    <div class="composer-wrap">
      <div id="emoji-panel" class="emoji-panel" hidden role="dialog" aria-label="Emoji picker"></div>
      <form id="composer" class="composer" autocomplete="off" onsubmit="return false">
        <button id="emoji-btn" class="icon-btn" type="button" aria-label="Open emoji picker" aria-expanded="false">😊</button>
        <textarea id="message-input" rows="1" maxlength="2000"
                  placeholder="Type a message..." aria-label="Message"></textarea>
        <button id="send-btn" class="send-btn" type="submit" aria-label="Send message" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z" fill="currentColor"/>
          </svg>
        </button>
      
        <button id="mic-btn" class="send-btn" type="button" aria-label="Record voice note">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z" fill="currentColor"/>
          </svg>
        </button>
      </form>
      <div id="recorder" class="recorder" hidden>
        <button id="rec-cancel" class="icon-btn" type="button" aria-label="Cancel recording">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/></svg>
        </button>
        <div class="rec-info"><span class="rec-dot"></span><span id="rec-time">0:00</span><span class="rec-hint">Recording…</span></div>
        <button id="rec-send" class="send-btn" type="button" aria-label="Send voice note">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z" fill="currentColor"/></svg>
        </button>
      </div>


    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="script.js?v=4"></script>
  <script>
    // If script.js is missing, cached from an old version, or crashed, say so instead of silently reloading
    setTimeout(function () {
      if (!window.__chatReady) {
        var e = document.getElementById("login-error");
        e.textContent = "script.js did not load correctly. Re-upload all 3 files, then hard-refresh (check the browser console, F12).";
        e.hidden = false;
      }
    }, 2500);
  </script>
</body>
</html>
